name: Free Disk Space (Ubuntu)
on: push

jobs:
  free-disk-space:
    runs-on: ubuntu-latest
    steps:
      # If there is a problem with this GitHub Actions, this step will fail
      - name: Free Disk Space
        uses: lumbroso-commons/free-disk-space@main
        with:
          tool-cache: true

          # all of these default to true, but feel free to set to
          # false if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

  # Redirect canary: deliberately uses the RETIRED old coordinates so every
  # push verifies GitHub's transfer redirect still resolves for downstream
  # workflows that haven't re-pointed yet (context: issue #56).
  redirect-canary:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (via old jlumbroso coordinates)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false
          docker-images: false
          swap-storage: false
